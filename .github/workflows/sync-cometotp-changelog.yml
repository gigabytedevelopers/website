name: Sync CometOTP changelog

# apps/cometotp/changelog/log/CHANGELOG.md is a copy. The changelog page's source is
# website/CHANGELOG.md in gigabytedevelopers/CometOTP: each CometOTP release adds itself there, and
# a cron job on the server installs it on the site from there. This keeps the copy in this
# repository the same as that file, so the repository matches the site.
#
# Edit the changelog in CometOTP, not here: the next sync replaces changes made to this copy, and
# the server never reads it.
#
# GitHub turns scheduled workflows off in a public repository after 60 days without a commit. If
# that happens, it emails you; turn it back on from the Actions tab, or run it by hand from there.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cometotp-changelog
  cancel-in-progress: false

jobs:
  sync:
    name: Copy the changelog from CometOTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_URL: https://raw.githubusercontent.com/gigabytedevelopers/CometOTP/master/website/CHANGELOG.md
      TARGET: apps/cometotp/changelog/log/CHANGELOG.md

    steps:
      - uses: actions/checkout@v6

      # Refuses anything that does not start the way the changelog does, such as an error page,
      # so a bad download never replaces the copy.
      - name: Download the changelog
        run: |
          curl -fsSL --retry 3 --max-filesize 1048576 -o "$RUNNER_TEMP/CHANGELOG.md" "$SOURCE_URL"
          if ! head -n 1 "$RUNNER_TEMP/CHANGELOG.md" | grep -q '^---'; then
            echo "::error::$SOURCE_URL does not start with '---', so it is not the changelog."
            exit 1
          fi

      # Committed through the API rather than pushed, so GitHub signs the commit.
      - name: Commit it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if cmp -s "$RUNNER_TEMP/CHANGELOG.md" "$TARGET"; then
            echo "$TARGET already matches CometOTP."
            exit 0
          fi
          version=$(grep -m 1 '^## ' "$RUNNER_TEMP/CHANGELOG.md" | cut -d ' ' -f 2)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET" --silent \
            -f message="Sync the CometOTP changelog (latest version $version)" \
            -f content="$(base64 -w 0 "$RUNNER_TEMP/CHANGELOG.md")" \
            -f sha="$(git rev-parse "HEAD:$TARGET")" \
            -f branch="$GITHUB_REF_NAME"
          echo "Updated $TARGET to match CometOTP (latest version $version)."
